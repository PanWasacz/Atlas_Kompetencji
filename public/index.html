<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Kompetencji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDE6D6;
  --paper2:#E4DAC3;
  --card:#FBF8F1;
  --ink:#332A1F;
  --ink-soft:#6B5D4A;
  --line:#CBBD9E;
  --forest:#24463A;
  --forest2:#3B6353;
  --brass:#A97B33;
  --brass-light:#C99A4C;
  --lvl1:#A8432B;
  --lvl3:#C17A2E;
  --lvl5:#96872F;
  --lvl7:#3F7860;
  --lvl9:#9C7412;
  --radius:14px;
  --shadow:0 2px 10px rgba(51,42,31,.08), 0 1px 2px rgba(51,42,31,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(ellipse at 15% 8%, rgba(169,123,51,.10), transparent 45%),
    radial-gradient(ellipse at 90% 92%, rgba(36,70,58,.10), transparent 45%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3{font-family:'Playfair Display',serif; margin:0 0 .3em; color:var(--forest);}
.mono{font-family:'JetBrains Mono',monospace;}
#app{max-width:1400px;margin:0 auto;padding:28px 24px 80px;}
.eyebrow{
  text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:600;
  color:var(--brass);margin-bottom:6px;
}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, .pill:focus-visible, .dot:focus-visible{outline:3px solid var(--brass-light); outline-offset:2px;}

/* ---------- top compass header ---------- */
.top-header{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.compass-mark{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--forest); position:relative;flex:none;
  background:
    conic-gradient(from 0deg, transparent 0 92deg, var(--brass) 92deg 98deg, transparent 98deg 182deg, var(--forest) 182deg 188deg, transparent 188deg 360deg);
}
.compass-mark::after{content:'';position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:var(--forest);top:0;bottom:0;left:0;right:0;}
.top-title{font-family:'Playfair Display',serif;font-weight:800;font-size:1.15rem;color:var(--forest);letter-spacing:.02em;}
.top-sub{font-size:.78rem;color:var(--ink-soft);}

/* ---------- stepper ---------- */
.stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;padding:10px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);}
.dot{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--paper2);
  display:flex;align-items:center;justify-content:center;font-size:1rem;flex:none;
  transition:transform .15s ease, border-color .15s ease;
}
.dot.done{border-color:var(--forest2); background:#e7efe9;}
.dot.current{border-color:var(--brass); background:#fbf1de; transform:scale(1.12);}
.dot.skip{border-style:dashed;}
.step-line{flex:1;height:2px;background:var(--line);min-width:8px;}
.results-flag{margin-left:auto;font-size:.78rem;color:var(--ink-soft);white-space:nowrap;padding:0 6px;}

/* ---------- cards / sections ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px;}
.intro-hero{text-align:left;margin-bottom:8px;}
.intro-hero h1{font-size:2rem;}
.intro-hero p{color:var(--ink-soft);max-width:60ch;}

.qblock{margin:20px 0;}
.qlabel{font-weight:600;margin-bottom:8px;color:var(--forest);}
.qhint{font-size:.8rem;color:var(--ink-soft);margin:-4px 0 8px;}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;}
.pill{
  border:1.5px solid var(--line);background:var(--paper2);color:var(--ink);
  padding:8px 14px;border-radius:999px;font-size:.86rem;font-weight:500;transition:.15s;
}
.pill:hover{border-color:var(--brass);}
.pill.active{background:var(--forest);border-color:var(--forest);color:var(--card);}

.btn{
  border:none;padding:11px 20px;border-radius:10px;font-weight:600;font-size:.92rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;
}
.btn-primary{background:var(--forest);color:var(--card);}
.btn-primary:hover{background:var(--forest2);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--brass);color:var(--ink);}
.btn-text{background:none;color:var(--brass);font-weight:600;padding:6px 4px;}
.btn-text:hover{color:var(--forest);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}
.navrow-left,.navrow-right{display:flex;gap:10px;align-items:center;}

/* ---------- assessment ---------- */
.comp-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px;}
.comp-icon{font-size:2.1rem;line-height:1;}
.comp-aspects{font-size:.82rem;color:var(--ink-soft);font-style:italic;margin:2px 0 0;}
.comp-instruction{font-size:.85rem;color:var(--ink-soft);margin:10px 0 16px;padding:8px 12px;background:var(--paper2);border-radius:8px;display:inline-block;}
.live-preview{margin-left:auto;text-align:right;flex:none;}
.live-score{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700;color:var(--forest);}
.live-badge{font-size:.72rem;color:var(--ink-soft);max-width:150px;}

.grid-levels-wrap{overflow-x:auto;padding-bottom:6px;margin:0 -2px;}
.aspect-table{border-collapse:collapse;width:100%;min-width:1020px;table-layout:fixed;}
.aspect-table col.col-label{width:180px;}
.aspect-table th.level-head{padding:9px 10px;color:#fff;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;text-align:left;vertical-align:top;}
.level-count{font-weight:500;text-transform:none;letter-spacing:0;font-size:.7rem;opacity:.9;display:block;margin-top:3px;}
.aspect-table th.asp-th{
  position:sticky;left:0;z-index:2;background:var(--paper2);
  text-align:left;font-size:.76rem;font-weight:700;color:var(--ink);
  padding:9px 10px;vertical-align:top;border-right:2px solid var(--line);
}
.asp-corner{position:sticky;left:0;z-index:3;background:var(--paper2);border-right:2px solid var(--line);}
.aspect-table td.asp-td{border:1px solid var(--line);padding:5px;vertical-align:top;background:#fff;}
.aspect-table tbody tr:nth-child(odd) td.asp-td{background:#fdfbf6;}
.aspect-table tbody tr:hover td.asp-td, .aspect-table tbody tr:hover th.asp-th{background:#f3ecd8;}
.asp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none;}
.asp-empty{color:var(--line);font-size:.75rem;padding:6px 4px;display:block;}
.chk{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;border-radius:6px;font-size:.8rem;cursor:pointer;border-left:3px solid transparent;}
.chk:hover{background:var(--paper2);}
.chk input{margin-top:3px;flex:none;width:15px;height:15px;accent-color:var(--forest);}

/* ---------- results ---------- */
.radar-wrap{display:flex;justify-content:center;padding:6px 0 4px;}
@media (max-width:640px){
  #app{padding:16px 10px 60px;}
  .card{padding:18px 12px;}
}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft);margin-top:4px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;}

.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:6px;}
.score-card{border-left:5px solid var(--line);background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
.score-card .sc-top{display:flex;justify-content:space-between;align-items:center;}
.sc-name{font-weight:700;font-size:.92rem;color:var(--forest);}
.sc-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.3rem;}
.sc-badge{margin-top:4px;font-size:.78rem;padding:4px 9px;border-radius:999px;color:#fff;display:inline-block;}
.sc-bar{height:6px;border-radius:4px;background:var(--paper2);margin-top:10px;overflow:hidden;}
.sc-bar > div{height:100%;}
.sc-jump{font-size:.72rem;margin-top:8px;display:inline-block;color:var(--brass);cursor:pointer;font-weight:600;}
.sc-jump:hover{text-decoration:underline;}
.sc-goals{margin-top:10px;font-size:.78rem;}
.sc-goals summary{cursor:pointer;color:var(--forest2);font-weight:600;}
.goal-group{margin-top:8px;}
.goal-group b{font-weight:600;color:var(--ink-soft);font-size:.74rem;}
.goal-group ul{margin:4px 0 0;padding-left:0;list-style:none;}
.goal-group li{display:flex;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--line);}
.goal-lvl{flex:none;font-size:.68rem;font-weight:700;color:var(--brass);}

.func-row{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;background:#fff;}
.func-row.target{border:2px solid var(--brass);background:#fdf6e9;}
.func-row.met{border-left:5px solid var(--forest2);}
.func-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.func-name{font-weight:700;color:var(--forest);}
.func-status{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;}
.status-met{background:#e2efe8;color:var(--forest2);}
.status-near{background:#fbeed6;color:var(--brass);}
.status-far{background:#f3e5e0;color:var(--lvl1);}
.func-reqs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.req-chip{font-size:.72rem;padding:3px 8px;border-radius:6px;background:var(--paper2);}
.req-chip.ok{background:#e2efe8;color:var(--forest2);}
.req-chip.bad{background:#f3e5e0;color:var(--lvl1);}

/* ---------- zakładki u góry / ekran startowy ---------- */
.top-header{flex-wrap:wrap;}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow);}
.tab{border:none;background:none;color:var(--ink-soft);font-weight:600;font-size:.86rem;padding:8px 16px;border-radius:999px;transition:.15s;}
.tab:hover{color:var(--ink);}
.tab.active{background:var(--forest);color:var(--card);}
.home-hero{text-align:center;padding:38px 24px 34px;}
.home-hero h1{font-size:2.3rem;}
.home-hero .lead{color:var(--ink-soft);max-width:62ch;margin:10px auto 0;font-size:1.02rem;}
.cta-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin:28px 0 4px;}
.btn-cta{font-size:1.1rem;padding:16px 38px;border-radius:999px;box-shadow:0 4px 14px rgba(36,70,58,.28);}
.cta-note{font-size:.8rem;color:var(--ink-soft);}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;}
.home-grid .card{margin-bottom:0;}
.home-grid h2{font-size:1.25rem;}
.home-list{margin:8px 0 0;padding-left:20px;color:var(--ink);font-size:.92rem;}
.home-list li{margin-bottom:6px;}
.scale-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.scale-chip{color:#fff;font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:999px;}
.steps{counter-reset:s;list-style:none;margin:10px 0 0;padding:0;}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px;font-size:.92rem;}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--forest);color:var(--card);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:center;}
.howto{margin:12px 0 4px;background:var(--paper2);border-radius:8px;padding:8px 12px;font-size:.85rem;}
.howto summary{cursor:pointer;font-weight:600;color:var(--forest);}
.howto ol{margin:8px 0 2px;padding-left:20px;color:var(--ink-soft);}
.howto li{margin-bottom:4px;}
.src{font-size:.76rem;color:var(--ink-soft);margin-top:12px;}
.src a{color:var(--brass);}
@media (max-width:640px){
  .tabs{margin-left:0;width:100%;justify-content:space-between;}
  .tab{flex:1;padding:8px 6px;}
  .home-hero h1{font-size:1.7rem;}
}

.section-title{margin-top:34px;}
.small-muted{font-size:.8rem;color:var(--ink-soft);}
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .card{box-shadow:none;break-inside:avoid;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DANE / DATA
   ========================================================= */
const LEVEL_VALUES=[1,3,5,7,9];
const LEVEL_NAMES=['Poniżej oczekiwań','Wymaga rozwoju','Świadomy i sprawny','Zaawansowany','Mistrz'];
const LEVEL_COLORS=['var(--lvl1)','var(--lvl3)','var(--lvl5)','var(--lvl7)','var(--lvl9)'];

const COMP = {
sam:{
  key:'sam', name:'Samodzielność i Rzetelność', icon:'🐆', accent:'#A8432B',
  aspects:['wykorzystanie umiejętności harcerskich do skutecznego działania','stawianie czoła wyzwaniom i trudnościom','planowanie','samokontrola','motywacja','rzetelność','samorozwój'],
  badges:['Wymaga nadzoru i pomocy — niesamodzielny','Niesamodzielny, wymaga motywowania','Zaradny, zdolny do rzetelnej pracy','Samodzielny, rzetelny','W pełni samodzielny i rzetelny — daje dobry przykład'],
  items:[
    ['Nie wykazuje się wiedzą i umiejętnościami wymaganymi na posiadany stopień harcerski.','W obliczu trudności poddaje się lub udaje, że nie widzi problemu, by uniknąć podjęcia działania.','Działa chaotycznie i bez planu.','Często zdarza mu się spóźnić lub nie dotrzymać terminu.','Łatwo daje się ponosić emocjom. Nie widzi potrzeby panowania nad nimi.','Pozostawiony bez nadzoru i motywacji zewnętrznej zniechęca się i nie doprowadza zadań do końca.','Wykonuje swoje zadania niedbale (byle jak).','Nie przyjmuje krytycznej informacji zwrotnej na swój temat.','Nie dostrzega swoich mocnych i słabych stron.','Nie wymaga od siebie i nie podejmuje pracy nad sobą z własnej inicjatywy.'],
    ['Wykazuje się minimalnym poziomem wiedzy i umiejętności wymaganych na posiadany stopień harcerski, ale bez chęci ich doskonalenia.','W obliczu trudności wybiera najłatwiejsze – pozorne lub prowizoryczne rozwiązania.','Wymaga szczegółowych instrukcji przy wykonywaniu bardziej złożonych zadań.','Zwykle dotrzymuje terminów i stara się dobrze wykorzystywać czas, prowadząc terminarz i listę zadań.','Wymaga pomocy w planowaniu bardziej złożonych działań.','W sytuacji stresującej ponoszą go emocje, powodując nieprzemyślane działanie.','Doprowadzanie rozpoczętych spraw do końca sprawia mu wyraźne trudności, zwłaszcza w ostatnich fazach działania lub gdy pojawiają się problemy.','Potrafi pracować starannie tylko przy wykonywaniu prostych i krótkotrwałych zadań, zwłaszcza gdy oczekuje nagrody.','Chętnie przyjmuje informację zwrotną.','Dostrzega swoje mocne i słabe strony i próbuje nad nimi pracować.'],
    ['Wykorzystuje biegle i chętnie doskonali wymaganą wiedzę i umiejętności harcerskie.','Daje sobie radę w typowych sytuacjach życia harcerskiego.','Mierzy się z trudnościami, poszukując najlepszych, choćby wymagających wysiłku rozwiązań.','Nie oczekuje szczegółowych instrukcji i pomocy podczas wykonywania zadań.','Planuje kolejne kroki w wykonywaniu bardziej złożonych zadań.','Stara się panować nad silnymi emocjami i trzeźwo oceniać sytuację.','Przełamuje własne zniechęcenie, znajdując wewnętrzną motywację do długotrwałego, systematycznego działania.','Przykłada się do wykonania zadań, które go szczególnie interesują, pozostałe wykonuje mniej rzetelnie.','Aktywnie zabiega o informację zwrotną o sobie i bierze ją pod uwagę.','Rozwija swoje zainteresowania i podnosi potrzebne kompetencje.','Podejmuje udane próby tworzenia pożądanych i zmiany niekorzystnych nawyków.'],
    ['Samodzielnie poszerza swoje umiejętności harcerskie ponad obowiązujący standard.','Przekazuje swoją wiedzę i umiejętności harcerskie innym.','Podejmuje działania i daje sobie radę w nietypowych i awaryjnych sytuacjach.','Wykonuje zadania samodzielnie.','Reaguje na problemy i podejmuje działania, aby je rozwiązać.','Tworzy elastyczne i czytelne plany działania.','Zachowuje spokój i pewność siebie w sytuacjach podwyższonego stresu.','Wytrwale dąży do osiągnięcia zamierzonych efektów.','Stara się wykonać najlepiej jak potrafi każdą pracę, jakiej się podjął.','Stawia sobie wysokie wymagania.','Efektywnie stosuje techniki pracy nad sobą prowadzące do kształtowania charakteru i postaw.'],
    ['Postępuje tak, aby poprzez przykład własny inspirować innych do pogłębiania wiedzy i doskonalenia umiejętności.','Chętnie podejmuje ambitne wyzwania i je realizuje.','Trafnie dobiera efektywne metody osiągnięcia zamierzonych celów.','Planując, przewiduje i zapobiega potencjalnym komplikacjom i zagrożeniom.','Zgłasza propozycje rozwiązań systemowych.','W sytuacjach krytycznych reaguje trafnie i zdecydowanie.','Wspiera i motywuje innych w realizacji ich zadań.','Pracuje rzetelnie niezależnie od tego, czy pracę wykonuje z własnej inicjatywy, czy została mu zlecona w ramach obowiązków.','Samodzielnie kieruje własnym rozwojem bez potrzeby motywowania z zewnątrz.','Efektywnie wspiera innych w pracy nad sobą (np. jako opiekun).']
  ],
  aspectOf:[
    [0,1,2,2,3,4,5,6,6,6],
    [0,1,1,2,2,3,4,5,6,6],
    [0,1,1,1,2,3,4,5,6,6,6],
    [0,0,1,1,1,2,3,4,5,6,6],
    [0,1,2,2,2,3,4,5,6,6]
  ]
},
wsp:{
  key:'wsp', name:'Współpraca i Odpowiedzialność', icon:'🐜', accent:'#6E7B35',
  aspects:['panowanie nad emocjami i reakcjami','empatia i dbanie o relacje','współpraca','zaangażowanie się w służbę','przestrzeganie prawa i przepisów','odpowiedzialność osobista','utożsamianie się z ideałami, celami i strategią działania ZHR'],
  badges:['Nie współpracuje, nie poczuwa się do odpowiedzialności','Ma trudności we współpracy, nie przejawia inicjatywy, unika odpowiedzialności','Prawidłowo współpracuje, odpowiedzialny','Efektywnie współpracuje, angażuje się, bierze odpowiedzialność za środowisko lokalne','Rozwija współpracę, zaangażowany, w pełni odpowiedzialny'],
  items:[
    ['Łatwo ulega negatywnym emocjom otoczenia.','Zwykle kieruje się własnym dobrem, nie licząc się z innymi.','Chętniej rywalizuje niż współpracuje w grupie.','Nie dotrzymuje ustaleń ważnych dla realizacji wspólnych zadań.','Unika lub niechętnie uczestniczy w zorganizowanej służbie.','Nie zna dotyczących go przepisów, więc nie stosuje się do nich.','Nie analizuje przyczyn własnych błędów i niepowodzeń.','Utożsamia harcerstwo wyłącznie z własną drużyną lub szczepem.'],
    ['Zwykle powstrzymuje się od gwałtownych i obraźliwych reakcji, ale w sytuacjach konfliktowych ma z tym wyraźne trudności.','Poproszony o pomoc udziela jej, o ile nie burzy to jego planów i nie zmusza do znacznego wysiłku.','Z trudem podporządkowuje się podziałowi zadań i zasadom pracy w grupie.','Robi tylko to, co musi, co wynika z zakresu obowiązków lub z polecenia przełożonego, nie wykazując inicjatywy i zaangażowania.','Zna obowiązujące go przepisy, ale stosuje się do nich wybiórczo.','W razie niepowodzeń szuka winnych i przyczyn na zewnątrz zamiast w sobie.','Nie angażuje się we wspólne działania poza własną drużyną / szczepem i nie widzi takiej potrzeby.'],

function ensureAns(key){
  if(!state.answers[key]) state.answers[key]={};
  return state.answers[key];

/* Zapasowe, proporcjonalne przybliżenie — używane tylko gdyby jakiejś kompetencji
   zabrakło realnej mapy aspectOf (nie powinno się zdarzyć, ale to bezpiecznik). */
function aspectIndexFor(nAspects, N, j){
  if(N<=1) return 0;
  return Math.min(nAspects-1, Math.floor(j*nAspects/N));
}

/* Metoda pełna z instrukcji: dla każdego aspektu (wiersza) ustal najwyższy zaznaczony
   poziom ("granica obszaru"), a poziom całej kompetencji to poziom, który wśród
   aspektów wychodzi najczęściej (dominanta), z remisem na korzyść wyższego poziomu
   ("licząc od prawej strony"). Niezaznaczone stwierdzenia poniżej i na granicy tego
   poziomu to konkretne cele rozwoju. Przypisanie stwierdzeń do aspektów (aspectOf)
   zostało odczytane bezpośrednio z kolorów oryginalnych map w PDF-ie Atlasu. */
function analyzeCompetency(key){
  const comp=getComp(key);
  const nAspects=comp.aspects.length;
  const ans=state.answers[key];
  const aspectMax=new Array(nAspects).fill(null);
  const allItems=[];
  comp.items.forEach((arr,levelIdx)=>{
    const lvl=LEVEL_VALUES[levelIdx];
    const N=arr.length;
    const checkedSet=(ans&&ans[lvl])||new Set();
    const rowMap=comp.aspectOf && comp.aspectOf[levelIdx];
    arr.forEach((text,j)=>{
      const aspect=(rowMap && rowMap[j]!=null) ? rowMap[j] : aspectIndexFor(nAspects,N,j);
      const checked=checkedSet.has(j);
      if(checked) aspectMax[aspect]= aspectMax[aspect]==null ? lvl : Math.max(aspectMax[aspect], lvl);
      allItems.push({lvl,j,text,aspect,checked});
    });
  });
  const countsByLevel={1:0,3:0,5:0,7:0,9:0};
  let anyAssessed=false;
  aspectMax.forEach(v=>{ if(v!=null){ countsByLevel[v]++; anyAssessed=true; } });
  if(!anyAssessed) return {level:null, aspectMax, allItems, priorityGoals:[], nextGoals:[]};
  let level=null, bestCount=-1;
  [...LEVEL_VALUES].reverse().forEach(lv=>{ if(countsByLevel[lv]>bestCount){ bestCount=countsByLevel[lv]; level=lv; } });
  const nextIdx=LEVEL_VALUES.indexOf(level)+1;
  const nextLevel = nextIdx<LEVEL_VALUES.length ? LEVEL_VALUES[nextIdx] : null;
  const priorityGoals=[], nextGoals=[];
  allItems.forEach(it=>{
    if(it.checked) return;
    if(it.lvl<level) priorityGoals.push(it);
    else if(it.lvl===level || it.lvl===nextLevel) nextGoals.push(it);
  });
  return {level, aspectMax, allItems, priorityGoals, nextGoals};
}

function computeScore(key){ return analyzeCompetency(key).level; }

function nearestLevelIdx(score){
  const exact=LEVEL_VALUES.indexOf(score);
  if(exact>=0) return exact;
  let best=0, bd=99;
  LEVEL_VALUES.forEach((v,i)=>{ const d=Math.abs(v-score); if(d<bd){bd=d; best=i;} });
  return best;
}

function levelColorFor(score){
  if(score==null) return '#B9AD90';
  return LEVEL_COLORS[nearestLevelIdx(score)].replace('var(--lvl1)','#A8432B').replace('var(--lvl3)','#C17A2E').replace('var(--lvl5)','#96872F').replace('var(--lvl7)','#3F7860').replace('var(--lvl9)','#9C7412');
}
/* direct hex map to avoid CSS var() inside SVG fill attrs */
const LEVEL_HEX=['#A8432B','#C17A2E','#96872F','#3F7860','#9C7412'];
const ASPECT_COLORS=['#8B4A3B','#3B6B8B','#5E8B3B','#8B6B2E','#6B4A8B','#2E6B6B','#8B3B6B','#5B6B2E','#3B4A8B'];
function hexForScore(score){ if(score==null) return '#B9AD90'; return LEVEL_HEX[nearestLevelIdx(score)]; }

function stepperHtml(){
  let dots='';
  WIZARD_ORDER.forEach((k,i)=>{
    const comp=getComp(k);
    const scored=computeScore(k)!==null || (state.answers[k]&&Object.keys(state.answers[k]).length>0 && computeScore(k)===null);
    const has=computeScore(k)!==null;
    let cls='dot';
    if(state.screen==='assess' && state.idx===i) cls+=' current';
    else if(has) cls+=' done';
    dots+=`<button class="${cls}" data-action="jump" data-idx="${i}" title="${esc(comp.name)}">${comp.icon}</button>`;
    if(i<WIZARD_ORDER.length-1) dots+=`<div class="step-line"></div>`;
  });
  return `<div class="stepper no-print">${dots}<span class="results-flag">
    <button class="btn-text" data-action="goresults">Zobacz wyniki →</button></span></div>`;
}

/* ---------------- radar ---------------- */
function buildRadar(scores, compareReq, order, compact){
  order = order || RADAR_ORDER;
  // compact = wąski ekran: mniejszy radar, krótkie jednowierszowe nazwy i większa
  // czcionka względem płótna, żeby po przeskalowaniu do ~350 px nadal były czytelne.
  const N=order.length, cx=360, cy=compact?290:300, maxR=compact?160:185;
  const LABEL_OFFSET=compact?34:38, ICON_FS=compact?28:19, LABEL_FS=compact?20:13, RING_FS=compact?15:9;
  const SHORT_NAME={sam:'Samodzielność',wsp:'Współpraca',kom:'Komunikacja',prz:'Przywództwo',met:'Metoda',ksz:'Kształcenie',zar:'Zarządzanie',kwa:'Kwatermistrzostwo'};
  function pt(r,i){ const a=(i*360/N)*Math.PI/180; return [cx+r*Math.sin(a), cy-r*Math.cos(a)]; }
  function ringPts(r){ return order.map((_,i)=>pt(r,i).join(',')).join(' '); }
  // Kilka nazw kompetencji jest zbyt długich, by zmieścić się w jednej linii przy
  // większej czcionce — dzielimy je ręcznie na dwa krótsze wiersze.
  const LABEL_WRAP={
    'Samodzielność i Rzetelność':['Samodzielność','i Rzetelność'],
    'Współpraca i Odpowiedzialność':['Współpraca i','Odpowiedzialność'],
    'Stosowanie Metody':['Stosowanie','Metody']
  };
  function wrapLabel(name){ return LABEL_WRAP[name] || [name]; }
  let svg = compact
    ? `<svg viewBox="36 36 664 490" width="664" height="490" style="max-width:100%;height:auto">`
    : `<svg viewBox="0 0 720 620" width="720" height="620" style="max-width:100%;height:auto">`;
  // rings
  [1,3,5,7,9].forEach(v=>{
    const r=(v-1)/8*maxR;
    svg+=`<polygon points="${ringPts(r)}" fill="none" stroke="#C9BB9E" stroke-width="1"/>`;
  });
  // ring value labels along top axis (index 0)
  [1,3,5,7,9].forEach(v=>{
    const r=(v-1)/8*maxR;
    const [x,y]=pt(r,0);
    svg+=`<text x="${x+4}" y="${y-3}" font-size="${RING_FS}" fill="#8a7c66" font-family="JetBrains Mono, monospace">${v}</text>`;
  });
  // axis lines + labels
  order.forEach((k,i)=>{
    const comp=getComp(k);
    const [x,y]=pt(maxR,i);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#C9BB9E" stroke-width="1"/>`;
    const [lx,ly]=pt(maxR+LABEL_OFFSET,i);
    let anchor='middle';
    if(lx<cx-10) anchor='end'; else if(lx>cx+10) anchor='start';
    svg+=`<text x="${lx}" y="${ly-4}" font-size="${ICON_FS}" text-anchor="${anchor}" font-family="Inter, sans-serif">${comp.icon}</text>`;
    const lines = compact ? [SHORT_NAME[k]||comp.name] : wrapLabel(comp.name.split(' (')[0]);
    svg+=`<text x="${lx}" y="${ly+(compact?18:15)}" font-size="${LABEL_FS}" text-anchor="${anchor}" fill="#3B2E22" font-family="Inter, sans-serif" font-weight="700">`;
    lines.forEach((line,li)=>{ svg+=`<tspan x="${lx}" dy="${li===0?0:15}">${esc(line)}</tspan>`; });
    svg+=`</text>`;
  });
  // compare polygon (function requirement)
  if(compareReq){
    const cpts=order.map((k,i)=>{
      const req=compareReq[k];
      const v=req||1;
      const r=(v-1)/8*maxR;
      return pt(r,i).join(',');
    }).join(' ');
    svg+=`<polygon points="${cpts}" fill="none" stroke="#A97B33" stroke-width="2" stroke-dasharray="6,5"/>`;
  }
  // data polygon
  const dpts=order.map((k,i)=>{
    const s=scores[k];
    const v=s==null?1:s;
    const r=(v-1)/8*maxR;
    return pt(r,i);
  });
  svg+=`<polygon points="${dpts.map(p=>p.join(',')).join(' ')}" fill="rgba(36,70,58,0.28)" stroke="#24463A" stroke-width="2.5"/>`;
  dpts.forEach(([x,y],i)=>{
    const k=order[i]; const s=scores[k];
    svg+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${hexForScore(s)}" stroke="#fff" stroke-width="1.5"/>`;
  });
  svg+=`</svg>`;
  return svg;
}

function funcStatus(func, scores){
  const reqKeys=Object.keys(func.req);
  let met=0, gaps=[];
  reqKeys.forEach(k=>{
    const s=scores[k];
    const req=func.req[k];
    if(s!=null && s>=req) met++;
    else gaps.push({k, have:s, need:req});
  });
  const ratio=met/reqKeys.length;
  let status='far';
  if(ratio===1) status='met';
  else if(gaps.length<=1 || ratio>=0.7) status='near';
  return {ratio, gaps, status, reqKeys};
}

  const targetFunc = FUNCTIONS.find(f=>f.name===state.funcTarget) || null;
  const order = state.radarMode==='5k' ? RADAR_ORDER_5K : RADAR_ORDER;
  const compact = !!(window.matchMedia && window.matchMedia('(max-width: 640px)').matches);
  const radarSvg = buildRadar(scores, targetFunc?targetFunc.req:null, order, compact);

  let scoreCards='';
  WIZARD_ORDER.forEach((k,i)=>{
    const comp=getComp(k);
    const s=scores[k];
    const an=analyses[k];
    const hex=hexForScore(s);
    const pct = s==null?0:((s-1)/8*100);
    const badge = s==null?'Nieocenione':comp.badges[nearestLevelIdx(s)];
    const goalsTotal=(an.priorityGoals.length+an.nextGoals.length);
    const goalsHtml = (s==null || goalsTotal===0) ? '' : `<details class="sc-goals">

        ${an.nextGoals.length?`<div class="goal-group"><b>Kolejny krok rozwoju:</b><ul>${an.nextGoals.slice(0,6).map(g=>`<li><span class="mono goal-lvl">${g.lvl}</span> ${esc(g.text)}</li>`).join('')}</ul>${an.nextGoals.length>6?`<div class="small-muted">+ ${an.nextGoals.length-6} więcej</div>`:''}</div>`:''}
      </details>`;
    scoreCards+=`<div class="score-card" style="border-left-color:${hex}">
      <div class="sc-top">
        <div><span style="font-size:1.2rem;margin-right:6px">${comp.icon}</span><span class="sc-name">${esc(comp.name.split(' (')[0])}</span></div>
        <div class="sc-num mono" style="color:${hex}">${s==null?'—':s}</div>
      </div>
      <div class="sc-badge" style="background:${hex}">${esc(badge)}</div>
      <div class="sc-bar"><div style="width:${pct}%;background:${hex}"></div></div>
      ${goalsHtml}
      <div class="sc-jump" data-action="jump" data-idx="${i}">edytuj odpowiedzi →</div>
    </div>`;
  });

  // function matching
  const withStatus = FUNCTIONS.map(f=>({f, st:funcStatus(f,scores)}));
  withStatus.sort((a,b)=> b.st.ratio - a.st.ratio);
  const targetEntry = targetFunc ? withStatus.find(e=>e.f.name===targetFunc.name) : null;
  const others = withStatus.filter(e=>!targetFunc || e.f.name!==targetFunc.name);

  function reqChipsHtml(f, st){
    return Object.keys(f.req).map(k=>{
      const comp=getComp(k);
      const s=scores[k];
      const ok = s!=null && s>=f.req[k];
      return `<span class="req-chip ${ok?'ok':'bad'}">${comp.icon} ${comp.name.split(' (')[0]} ${s==null?'—':s}/${f.req[k]}</span>`;
    }).join('');
  }
  function funcRowHtml(entry, isTarget){
    const {f,st}=entry;
    const statusLabel = st.status==='met'?'Spełniasz ✓':(st.status==='near'?'Blisko celu':'Do zdobycia');
    const statusCls = st.status==='met'?'status-met':(st.status==='near'?'status-near':'status-far');
    return `<div class="func-row ${isTarget?'target':''} ${st.status==='met'?'met':''}">
      <div class="func-top">
        <div class="func-name">${isTarget?'🎯 ':''}${esc(f.name)}</div>
        <div class="func-status ${statusCls}">${statusLabel}</div>
      </div>
      <div class="func-reqs">${reqChipsHtml(f,st)}</div>
    </div>`;
  }

  const metFuncs = others.filter(e=>e.st.status==='met');
  const nearFuncs = others.filter(e=>e.st.status==='near');
  const restCount = others.length - metFuncs.length - nearFuncs.length;

  app.innerHTML = `
    ${headerHtml()}
    ${stepperHtml()}

      <div class="eyebrow">Wynik ekspedycji</div>
      <h2>Twoja Mapa Kompetencji</h2>
      <p class="small-muted">${state.funcCurrent&&state.funcCurrent.indexOf('nie dotyczy')<0?('Obecna funkcja: <b>'+esc(state.funcCurrent)+'</b>. '):''}${state.rankHarcCurrent&&state.rankHarcCurrent.indexOf('brak')<0?('Stopień harcerski: <b>'+esc(state.rankHarcCurrent)+'</b>. '):''}${state.rankInstrCurrent&&state.rankInstrCurrent.indexOf('brak')<0?('Stopień instruktorski: <b>'+esc(state.rankInstrCurrent)+'</b>'+(/\.$/.test(state.rankInstrCurrent)?'':'.')):''}</p>
      <div class="navrow no-print" style="margin:0 0 4px">
        <div></div>
        <div class="pillrow">
          <button class="pill ${state.radarMode==='5k'?'active':''}" data-action="radarmode" data-mode="5k">Siatka 5K</button>
          <button class="pill ${state.radarMode==='8k'?'active':''}" data-action="radarmode" data-mode="8k">Siatka 8K</button>
        </div>
      </div>
      <div class="radar-wrap">${radarSvg}</div>
      <div class="legend">
        <span><span class="swatch" style="background:#24463A"></span>Twój profil</span>
        ${targetFunc?'<span><span class="swatch" style="background:#A97B33;border:1px dashed #A97B33"></span>Wymagania: '+esc(targetFunc.name)+'</span>':''}
      </div>
    </div>

    <div class="card">
      <h3 class="section-title" style="margin-top:0">Twoje wyniki w szczegółach</h3>
      <p class="small-muted">Poziom to nie średnia zaznaczeń, tylko ten, który najczęściej wychodzi jako granica obszaru w poszczególnych aspektach kompetencji (zgodnie z metodą pełną z Atlasu).</p>
      <div class="score-grid">${scoreCards}</div>
    </div>

    <div class="card">
      <h3 class="section-title" style="margin-top:0">Twoje szlaki — dopasowanie do funkcji</h3>
      ${targetEntry?`<p class="small-muted">Twój cel:</p>${funcRowHtml(targetEntry,true)}`:'<p class="small-muted">Nie wybrałeś funkcji docelowej — oto pełne zestawienie.</p>'}
      ${metFuncs.length?`<p class="small-muted" style="margin-top:16px">Już się kwalifikujesz:</p>${metFuncs.map(e=>funcRowHtml(e,false)).join('')}`:''}
      ${nearFuncs.length?`<p class="small-muted" style="margin-top:16px">Blisko celu:</p>${nearFuncs.map(e=>funcRowHtml(e,false)).join('')}`:''}
      ${restCount>0?`<details style="margin-top:14px"><summary class="small-muted" style="cursor:pointer">Pokaż pozostałe funkcje (${restCount})</summary>${others.filter(e=>e.st.status==='far').map(e=>funcRowHtml(e,false)).join('')}</details>`:''}
    </div>

    <div class="navrow no-print">
      <button class="btn btn-ghost" data-action="restart">↺ Zacznij od nowa</button>
      <button class="btn btn-ghost" data-action="print">🖨 Drukuj / zapisz PDF</button>
    </div>
  `;
}

function render(){
  if(state.screen==='home') renderHome();
  else if(state.screen==='intro') renderIntro();
  else if(state.screen==='assess') renderAssess();
  else if(state.screen==='results') renderResults();
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  saveState();
}

/* =========================================================
   ZDARZENIA / EVENTS
   ========================================================= */
app.addEventListener('click', e=>{
  const btn=e.target.closest('[data-action]');
  if(btn){
    const action=btn.dataset.action;
    if(action==='begin'){
      const r=state.resume;
      if(r && r.screen!=='home'){ state.screen=r.screen; state.idx=r.idx||0; }
      else { state.screen='intro'; }
      state.resume=null; render();
    }
    else if(action==='gohome' || action==='pause'){
      if(state.screen!=='home') state.resume={screen:state.screen, idx:state.idx};
      state.screen='home'; render();
    }
    else if(action==='forget'){
      if(confirm('Usunąć wszystkie zaznaczenia i zacząć od nowa?')){ resetAll(); render(); }
    }
    else if(action==='start'){ state.screen='assess'; state.idx=0; render(); }
    else if(action==='next'){
      if(state.idx<WIZARD_ORDER.length-1){ state.idx++; render(); }
      else { state.screen='results'; render(); }
    }
    else if(action==='back'){
      if(state.idx>0){ state.idx--; render(); } else { state.screen='intro'; render(); }
    }
    else if(action==='skip'){
      const key=WIZARD_ORDER[state.idx];
      delete state.answers[key];
      if(state.idx<WIZARD_ORDER.length-1){ state.idx++; } else { state.screen='results'; }
      render();
    }
    else if(action==='jump'){
      state.screen='assess'; state.idx=parseInt(btn.dataset.idx,10); render();
    }
    else if(action==='goresults'){ state.screen='results'; render(); }
    else if(action==='radarmode'){ state.radarMode=btn.dataset.mode; render(); }
    else if(action==='restart'){ resetAll(); state.screen='intro'; render(); }
    else if(action==='print'){ window.print(); }
    return;
  }
  const pill=e.target.closest('.pill');
  if(pill){
    const q=pill.dataset.q, v=pill.dataset.v;
    state[q]=v;
    pill.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p===pill));
    saveState();
  }
});

app.addEventListener('change', e=>{
  const input=e.target;
  if(input.matches('input[type=checkbox][data-level]')){
    const key=WIZARD_ORDER[state.idx];
    const lvl=parseInt(input.dataset.level,10);
    const j=parseInt(input.dataset.j,10);
    const ans=ensureAns(key);
    if(!ans[lvl]) ans[lvl]=new Set();
    if(input.checked) ans[lvl].add(j); else ans[lvl].delete(j);
    updateLivePreview();
    saveState();
  }
});

/* =========================================================
   ZAPIS POSTĘPU (tylko w tej przeglądarce, localStorage)
   ========================================================= */
const STORE_KEY='atlas-kompetencji-v1';
const SAVED_FIELDS=['rankHarcCurrent','rankHarcTarget','rankInstrCurrent','rankInstrTarget','funcCurrent','funcTarget','methodTrack','radarMode'];

function saveState(){
  try{
    const o={resume: state.screen==='home' ? state.resume : {screen:state.screen, idx:state.idx}, answers:{}};
    SAVED_FIELDS.forEach(f=>o[f]=state[f]);
    Object.keys(state.answers).forEach(k=>{
      o.answers[k]={};
      Object.keys(state.answers[k]).forEach(l=>o.answers[k][l]=[...state.answers[k][l]]);
    });
    localStorage.setItem(STORE_KEY, JSON.stringify(o));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const o=JSON.parse(raw);
    SAVED_FIELDS.forEach(f=>{ if(o[f]!==undefined) state[f]=o[f]; });
    Object.keys(o.answers||{}).forEach(k=>{
      if(!COMP[k]) return;
      state.answers[k]={};
      Object.keys(o.answers[k]).forEach(l=>state.answers[k][l]=new Set(o.answers[k][l]));
    });
    if(o.resume && o.resume.screen && o.resume.screen!=='home') state.resume=o.resume;
  }catch(e){}
}

function resetAll(){
  state.idx=0; state.answers={}; state.resume=null;
  state.rankHarcCurrent=null; state.rankHarcTarget=null; state.rankInstrCurrent=null; state.rankInstrTarget=null;
  state.funcCurrent=null; state.funcTarget=null; state.methodTrack='harcerska'; state.radarMode='8k';
  state.screen='home';
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

loadState();

// Po zmianie szerokości ekranu (np. obrót telefonu) przełącz wariant radaru.
try{
  const mq=window.matchMedia('(max-width: 640px)');
  const onChange=()=>{ if(state.screen==='results') render(); };
  if(mq.addEventListener) mq.addEventListener('change',onChange); else if(mq.addListener) mq.addListener(onChange);
}catch(e){}

render();
</script>
</body>
</html>
